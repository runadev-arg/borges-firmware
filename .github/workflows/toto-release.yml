name: Publish Toto X4 Release

on:
  push:
    tags:
      - "toto-v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"

      - name: Install PlatformIO
        run: pip install -U https://github.com/pioarduino/platformio-core/archive/refs/tags/v6.1.19.zip

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: toto-pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}
          restore-keys: toto-pio-${{ runner.os }}-

      - name: Run host parser and sync tests
        run: |
          cmake -S test -B build/test -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/test
          ctest --test-dir build/test --output-on-failure -j

      - name: Build current Toto firmware
        run: SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)" pio run -e toto_release

      - name: Build pinned known-good firmware
        env:
          KNOWN_GOOD_COMMIT: 1b84af0017724956db1baf5677b3b56345b94ec1
          CROSSPOINT_RC_HASH: 1b84af001772
        run: |
          git worktree add "$RUNNER_TEMP/crosspoint-known-good" "$KNOWN_GOOD_COMMIT"
          git -C "$RUNNER_TEMP/crosspoint-known-good" submodule update --init --recursive
          SOURCE_DATE_EPOCH="$(git -C "$RUNNER_TEMP/crosspoint-known-good" show -s --format=%ct HEAD)" \
            pio run --project-dir "$RUNNER_TEMP/crosspoint-known-good" -e gh_release_rc

      - name: Assemble target-bound manifests
        env:
          KNOWN_GOOD_VERSION: 1.4.1-rc+1b84af001772
        run: |
          set -euo pipefail
          mkdir -p dist
          cp .pio/build/toto_release/firmware.bin dist/firmware.bin
          cp "$RUNNER_TEMP/crosspoint-known-good/.pio/build/gh_release_rc/firmware.bin" \
            dist/firmware-known-good.bin
          python - <<'PY'
          import hashlib, json, os, pathlib

          root = pathlib.Path("dist")
          tag = os.environ["GITHUB_REF_NAME"]
          version = tag.removeprefix("toto-v")
          base = f"https://github.com/totokatz/crosspoint-toto/releases/download/{tag}"

          def descriptor(name):
              data = (root / name).read_bytes()
              return {
                  "url": f"{base}/{name}",
                  "size": len(data),
                  "sha256": hashlib.sha256(data).hexdigest(),
              }

          stable = {
              "manifest_schema": 1,
              "product": "crosspoint-toto",
              "target": "xteink-x4-esp32c3",
              "channel": "stable",
              "version": version,
              "sync_protocol_min": 2,
              "firmware": descriptor("firmware.bin"),
              "release_notes": "Toto Sync v2 para Xteink X4.",
              "rollback": {
                  "version": os.environ["KNOWN_GOOD_VERSION"],
                  "manifest_url": "/api/releases/x4/known-good/manifest.json",
              },
          }
          known_good = {
              **{k: v for k, v in stable.items() if k != "rollback"},
              "channel": "known-good",
              "version": os.environ["KNOWN_GOOD_VERSION"],
              "firmware": descriptor("firmware-known-good.bin"),
              "release_notes": "Imagen conocida para recuperación.",
          }
          (root / "manifest.json").write_text(
              json.dumps(stable, indent=2) + "\n", encoding="utf-8"
          )
          (root / "manifest-known-good.json").write_text(
              json.dumps(known_good, indent=2) + "\n", encoding="utf-8"
          )
          lines = []
          for file in sorted(root.iterdir()):
              if file.name == "SHA256SUMS":
                  continue
              lines.append(f"{hashlib.sha256(file.read_bytes()).hexdigest()}  {file.name}")
          (root / "SHA256SUMS").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/* \
              --title "CrossPoint Toto ${GITHUB_REF_NAME#toto-v}" \
              --notes "Release X4 con Toto Sync v2, manifiesto target-bound, SHA-256 y rollback known-good."
          fi
